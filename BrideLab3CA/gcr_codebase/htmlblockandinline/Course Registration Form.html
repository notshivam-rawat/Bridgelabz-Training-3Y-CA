<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>

<h1>Course Registration Form</h1>

<form>
    <fieldset>
        <legend>Student Details</legend>

        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Email:</label>
        <input type="email" name="email">
    </fieldset>

    <br>

    <fieldset>
        <legend>Course Selection</legend>

        <label>Select Course:</label>

        <select>
            <option>Java</option>
            <option>Python</option>
            <option>Web Development</option>
            <option>Data Science</option>
        </select>
    </fieldset>
</form>

<h2>Available Course Schedule</h2>

<table border="1">
    <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Instructor</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>10:00 AM</td>
        <td>Mr. Sharma</td>
    </tr>
    <tr>
        <td>Wednesday</td>
        <td>11:00 AM</td>
        <td>Ms. Gupta</td>
    </tr>
</table>

</body>
</html>
