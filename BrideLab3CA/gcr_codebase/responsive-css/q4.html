<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 Responsive Typography</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#eae5ff;padding:40px}
.typography{max-width:900px;margin:80px auto;padding:40px;background:white;border-radius:15px;text-align:center}
h1{font-size:clamp(1.5rem,4vw,3rem);margin-bottom:25px}
p{font-size:clamp(1rem,2vw,1.5rem);line-height:1.6}
@media(max-width:700px){.typography{margin:30px auto;padding:25px}.typography p{line-height:1.8;margin-top:10px}}
</style>
</head>
<body>
<main><section class="typography">
<h1>Responsive Typography</h1>
<p>Responsive typography allows text to automatically adjust its size according to the screen width. The clamp() function helps create readable text on different devices.</p>
</section></main>
</body>
</html>
