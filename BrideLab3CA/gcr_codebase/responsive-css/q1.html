<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q1 Responsive Image Filter Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#eae5ff;padding:40px}
h1{text-align:center;margin-bottom:30px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:25px;max-width:1100px;margin:auto}
figure{background:white;border-radius:12px;overflow:hidden;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.15)}
img{width:100%;height:220px;object-fit:cover;display:block;transition:filter .4s ease,transform .4s ease}
figure:hover img{filter:none;transform:scale(1.03)}
.blur{filter:blur(4px)}.gray{filter:grayscale(100%)}.sepia{filter:sepia(100%)}.bright{filter:brightness(150%)}.contrast{filter:contrast(180%)}.hue{filter:hue-rotate(90deg)}
figcaption{padding:15px;font-weight:600}
@media(max-width:600px){body{padding:20px}.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section>
<h1>Responsive Image Filter Gallery</h1>
<div class="gallery">
<figure><img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain"><figcaption>Blur</figcaption></figure>
<figure><img class="gray" src="https://picsum.photos/id/1016/600/400" alt="Nature"><figcaption>Grayscale</figcaption></figure>
<figure><img class="sepia" src="https://picsum.photos/id/1025/600/400" alt="Dog"><figcaption>Sepia</figcaption></figure>
<figure><img class="bright" src="https://picsum.photos/id/1035/600/400" alt="River"><figcaption>Brightness</figcaption></figure>
<figure><img class="contrast" src="https://picsum.photos/id/1043/600/400" alt="Forest"><figcaption>Contrast</figcaption></figure>
<figure><img class="hue" src="https://picsum.photos/id/1050/600/400" alt="Mountain"><figcaption>Hue Rotate</figcaption></figure>
</div>
</section>
</main>
</body>
</html>
