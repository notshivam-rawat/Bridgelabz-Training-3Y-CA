<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 Filter Cards with Animation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#eae5ff;padding:40px}
h1{text-align:center;margin-bottom:30px}
.profiles{display:flex;gap:25px;justify-content:center}
.card{background:white;border-radius:12px;overflow:hidden;text-align:center;width:280px;padding-bottom:20px;animation:fadeIn .8s ease;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-10px);box-shadow:0 10px 25px rgba(0,0,0,.2)}
.card img{width:100%;height:220px;object-fit:cover;transition:filter .4s}
.card:hover img{filter:none}
.profile-gray{filter:grayscale(100%)}.profile-sepia{filter:sepia(100%)}.profile-contrast{filter:contrast(170%)}
.card h2{margin:15px}.card p{padding:0 15px}
@keyframes fadeIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:800px){.profiles{flex-direction:column;align-items:center}.card{width:min(100%,400px)}}
</style>
</head>
<body>
<main><h1>Profile Cards</h1><section class="profiles">
<article class="card"><img class="profile-gray" src="https://picsum.photos/id/1005/500/400" alt="Profile"><h2>Alex</h2><p>Web Developer</p></article>
<article class="card"><img class="profile-sepia" src="https://picsum.photos/id/1012/500/400" alt="Profile"><h2>Sam</h2><p>UI Designer</p></article>
<article class="card"><img class="profile-contrast" src="https://picsum.photos/id/1011/500/400" alt="Profile"><h2>Jordan</h2><p>Cloud Engineer</p></article>
</section></main>
</body>
</html>
