<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q8 Filter Comparison Layout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#eae5ff;padding:40px}
h1{text-align:center;margin-bottom:30px}
.comparison{display:flex;gap:30px;max-width:1000px;margin:auto}
figure{background:white;padding:15px;border-radius:12px;text-align:center;flex:1}
img{width:100%;height:350px;object-fit:cover;display:block;margin-bottom:15px}
.filtered{filter:brightness(60%);transition:filter .5s}
figure:hover .filtered{filter:none}
figcaption{font-weight:600}
@media(max-width:700px){.comparison{flex-direction:column}}
</style>
</head>
<body>
<main><h1>Filter Comparison</h1><section class="comparison">
<figure><img src="https://picsum.photos/id/1015/700/500" alt="Original image"><figcaption>Original Image</figcaption></figure>
<figure><img class="filtered" src="https://picsum.photos/id/1015/700/500" alt="Filtered image"><figcaption>Filtered Image - Hover to Remove Filter</figcaption></figure>
</section></main>
</body>
</html>
